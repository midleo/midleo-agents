---
- set_fact:
    agent_install_dir: "D:/apps/midleoagent/"
    python_install_dir: "{{ python_install_dir | default('D:/apps/Python') }}"

- name: Check mwagent.config exists for deactivate
  win_stat:
    path: "{{ agent_install_dir }}config/mwagent.config"
  register: midleo_mwcfg_stat

- name: Mark Midleo server inactive in Core before local removal
  win_command: "{{ python_install_dir }}/python.exe -u {{ agent_install_dir }}runable/deactivate_server.py"
  args:
    chdir: "{{ agent_install_dir }}"
  register: midleo_deactivate
  failed_when: false
  changed_when: midleo_deactivate.rc is defined and midleo_deactivate.rc == 0
  when: midleo_mwcfg_stat.stat.exists | default(false)

- name: Warn when Core deactivate did not succeed
  debug:
    msg: "Midleo Core deactivate returned rc={{ midleo_deactivate.rc | default('n/a') }}; continuing local remove."
  when:
    - midleo_mwcfg_stat.stat.exists | default(false)
    - midleo_deactivate.rc is defined
    - midleo_deactivate.rc != 0

- name: delete scheduled task to run python agent on boot
  win_scheduled_task:
    name: midleoagent
    description: Run the midleoagent on boot
    state: absent

- name: delete scheduled task to run python actions agent on boot
  win_scheduled_task:
    name: midleoactions
    description: Run the midleoactions on boot
    state: absent

- name: delete scheduled task to run cronjobs every minute
  win_scheduled_task:
    name: midleocron
    state: absent

- name: Remove midleoagent
  win_file:
    path: "{{ agent_install_dir }}"
    state: absent
